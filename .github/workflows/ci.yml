name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, service, and distiller tests (Ubuntu / Node 22)
    runs-on: ubuntu-latest
    # The evidence distiller integration suite performs real filesystem,
    # package, Agent, and replay workflows. Ubuntu hosted storage can take
    # more than 20 minutes even though the same 85 tests finish locally in
    # about 10 minutes, so leave enough room for a deterministic serial run.
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check source diff format
        run: git diff --check

      - name: Build production frontend
        run: npm run build

      - name: Run service test suite
        run: npm run test:server

      - name: Run conversation distiller test suite
        run: npm run test:session-forensics

  portable-windows:
    name: Portable installer test (Windows x64 / Node 22)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Windows portable installer test
        run: npm run test:portable

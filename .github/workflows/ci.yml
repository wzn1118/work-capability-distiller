name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, service, and distiller tests (Ubuntu / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check source diff format
        run: git diff --check

      - name: Build production frontend
        run: npm run build

      - name: Run service test suite
        run: npm run test:server

      - name: Run conversation distiller test suite
        run: npm run test:session-forensics

  portable-windows:
    name: Portable installer test (Windows x64 / Node 22)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Windows portable installer test
        run: npm run test:portable

      - name: Build downloadable Windows installer
        run: npm run release:windows

      - name: Verify downloadable Windows installer
        shell: pwsh
        run: |
          $manifest = Get-ChildItem 'output/main-workbench-distributions/*-manifest.json' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $manifest) { throw '找不到 Windows 发布清单。' }
          npm run release:verify -- "$($manifest.FullName)"

      - name: Upload Windows installer, ZIP, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: work-capability-distiller-windows-x64-${{ github.sha }}
          path: |
            output/main-workbench-distributions/*-setup.exe
            output/main-workbench-distributions/*.zip
            output/main-workbench-distributions/*-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
